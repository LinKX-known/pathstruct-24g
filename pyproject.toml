[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathstruct-24g"
version = "0.1.0"
description = "24 GB feasibility pilot for structure-supervised Qwen3-VL: counterfactual structural supervision on a single RTX 4090."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pathstruct contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
qwen = [
    "torch>=2.4",
    # transformers 5.x requires torch>=2.6; this pilot is validated on 4.57
    "transformers>=4.57,<5",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=0.34",
    "peft>=0.13",
    "bitsandbytes>=0.43",
]
dev = [
    "pytest>=8",
    "scikit-learn>=1.3",
]
wsi = [
    "openslide-python>=1.3",
]
tda = [
    "gudhi>=3.10",
    "ripser>=0.6",
    "persim>=0.3",
]

[project.scripts]
pilot = "pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
