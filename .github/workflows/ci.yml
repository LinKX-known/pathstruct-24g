name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
      - name: cli smoke (synthetic cohort, no model)
        run: |
          python -m pilot.cli synth --out data/synth --per-class 2 --size 256
          python -m pilot.cli segment --images data/synth/images --out data/synth/cells
          python -m pilot.cli doctor --manifest data/synth/manifest.csv --cells data/synth/cells
          python -m pilot.cli build --manifest data/synth/manifest.csv --cells data/synth/cells --out data/synth --per-roi 3
          python -m pilot.cli segbench --images data/synth/images --masks data/synth/images --limit 2 || true
